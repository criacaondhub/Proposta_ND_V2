version: "3.7"

# ⚠️ PREENCHER antes do deploy: ⚠️DOMINIO e ⚠️NOME_REDE (rede externa do Traefik na VPS)
services:
  proposta-nd-med-duo:
    image: proposta-nd-med-duo:latest
    build: .
    networks:
      - ⚠️NOME_REDE
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        # Só /proposta e /proposta/...: o resto do domínio continua com o que já responde por ele.
        # O caminho chega inteiro ao container (sem strip de prefixo).
        - traefik.http.routers.proposta-nd-med-duo.rule=Host(`⚠️DOMINIO`) && (Path(`/proposta`) || PathPrefix(`/proposta/`))
        - traefik.http.routers.proposta-nd-med-duo.priority=1000
        - traefik.http.routers.proposta-nd-med-duo.entrypoints=websecure
        - traefik.http.routers.proposta-nd-med-duo.tls.certresolver=letsencryptresolver
        - traefik.http.routers.proposta-nd-med-duo.service=proposta-nd-med-duo
        - traefik.http.services.proposta-nd-med-duo.loadbalancer.server.port=80
        - traefik.http.services.proposta-nd-med-duo.loadbalancer.passHostHeader=true

networks:
  ⚠️NOME_REDE:
    name: ⚠️NOME_REDE
    external: true
