# Proposta ND Med Duo, publicada em https://⚠️DOMINIO/proposta
# O Traefik só encaminha para este container /proposta e /proposta/... (ver docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proposta privada: nenhum buscador indexa
    add_header X-Robots-Tag "noindex, nofollow" always;

    # /proposta (sem barra) abre direto, sem redirecionar para /proposta/
    location = /proposta {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /proposta/index.html =404;
    }

    # JS e CSS com hash no nome (gerados pelo Vite): cache de 1 ano
    location ~* "^/proposta/assets/.+-[\w-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fotos, prints e logo mantêm o nome quando são trocados: cache curto
    location /proposta/assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html sempre revalidado, para um deploy novo aparecer na hora
    location /proposta/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /proposta/index.html;
    }

    # Acesso direto ao container (teste local): leva para a proposta
    location = / {
        return 302 /proposta;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
